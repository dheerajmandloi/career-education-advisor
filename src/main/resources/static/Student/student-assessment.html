<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Take your career assessment to find your ideal path">
    <title>Career Assessment | CareerAdvisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        :root {
            --purple: #8B5CF6;
            --purple-dark: #7C3AED;
            --blue: #3B82F6;
            --cyan: #06B6D4;
            --green: #22C55E;
            --red: #EF4444;
            --bg: #FAFAFE;
            --surface: #FFFFFF;
            --soft: #F7F4FF;
            --text: #172033;
            --text-soft: #59657A;
            --muted: #858DA0;
            --border: #E6E1F2;
            --gradient: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 100%);
            --shadow: 0 18px 46px rgba(76, 57, 145, .09);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            font-family: "Space Grotesk", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 8% 4%, rgba(139, 92, 246, .10), transparent 24%),
                radial-gradient(circle at 94% 86%, rgba(59, 130, 246, .08), transparent 26%),
                var(--bg);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(139, 92, 246, .025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, .025) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .8), transparent 95%);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
            border: 0;
        }

        /* ==================== NAVBAR ==================== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: 76px;
            display: grid;
            grid-template-columns: minmax(260px, 1fr) auto minmax(260px, 1fr);
            align-items: center;
            gap: 20px;
            padding: 0 28px;
            background: rgba(255, 255, 255, .94);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 28px rgba(76, 57, 145, .05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            justify-self: start;
        }

        .brand-mark {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            color: #fff;
            background: var(--gradient);
            box-shadow: 0 11px 25px rgba(99, 102, 241, .22);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -.55px;
            line-height: 1;
        }

        .brand-sub {
            margin-top: 4px;
            color: #979DAC;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .7px;
        }

        .nav-wrap {
            display: flex;
            justify-content: center;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-link {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
            border-radius: 12px;
            color: #606B7D;
            font-size: 14px;
            font-weight: 700;
            transition: .2s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--purple-dark);
            background: #F6F2FF;
        }

        .account-area {
            display: flex;
            align-items: center;
            justify-self: end;
            gap: 8px;
        }

        .account-trigger {
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 8px 5px 5px;
            border-radius: 14px;
            background: transparent;
            cursor: pointer;
        }

        .account-avatar {
            width: 39px;
            height: 39px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: var(--purple-dark);
            background: linear-gradient(135deg, #EEE8FF, #E8F1FF);
            font-size: 11px;
            font-weight: 800;
        }

        .account-name {
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
        }

        /* ==================== CONTENT ==================== */
        .content {
            width: min(1180px, calc(100% - 52px));
            margin: 0 auto;
            padding: 28px 0 52px;
        }

        .page-header h1 {
            font-size: clamp(29px, 3vw, 39px);
            letter-spacing: -1px;
        }

        .page-header p {
            margin-top: 7px;
            color: var(--muted);
            font-size: 14px;
        }

        /* ==================== ASSESSMENT CARD ==================== */
        .assessment-card {
            margin-top: 24px;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: #FFFFFF;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .progress-container {
            margin-bottom: 25px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-soft);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #EFEAF8;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--gradient);
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #FCFBFF;
            color: var(--text);
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            border-color: var(--purple);
            background: #F7F3FF;
            transform: translateY(-1px);
        }

        .option-btn.selected {
            border-color: var(--purple);
            background: #F1ECFF;
            color: var(--purple-dark);
            box-shadow: 0 0 0 2px var(--purple);
        }

        .action-btns {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .btn-secondary {
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-soft);
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .btn-secondary:hover {
            background: #F8F7FC;
        }

        .btn-primary {
            padding: 12px 28px;
            border-radius: 12px;
            background: var(--gradient);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(99, 102, 241, .2);
            transition: .2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        /* ==================== RESULT SCREEN ==================== */
        .result-box {
            text-align: center;
            display: none;
            padding: 20px 0;
        }

        .result-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #E8FBF4;
            color: var(--green);
            display: grid;
            place-items: center;
            font-size: 30px;
        }

        .result-box h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .result-box p {
            color: var(--text-soft);
            font-size: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .navbar {
                grid-template-columns: 1fr auto;
            }

            .nav-wrap {
                display: none;
            }

            .content {
                width: calc(100% - 24px);
            }
        }
    </style>
</head>

<body>
    <!-- HEADER NAVBAR -->
    <header class="navbar">
        <div class="brand">
            <div class="brand-mark"><i class="fa-solid fa-compass"></i></div>
            <div>
                <div class="brand-name">CareerAdvisor</div>
                <div class="brand-sub">STUDENT PORTAL</div>
            </div>
        </div>

        <nav class="nav-wrap">
            <div class="nav">
                <a class="nav-link" href="student-dashboard.html">Dashboard</a>
                <a class="nav-link" href="student-profile.html">Profile</a>
                <a class="nav-link active" href="student-assessment.html">Assessment</a>
            </div>
        </nav>

        <div class="account-area">
            <div class="account-trigger">
                <span class="account-avatar" id="accountAvatar">S</span>
                <span class="account-name" id="accountName">Student</span>
            </div>
            <button onclick="logout()" class="btn-secondary" style="padding: 8px 14px; font-size:12px;">Logout</button>
        </div>
    </header>

    <!-- MAIN ASSESSMENT SECTION -->
    <main class="content">
        <div class="page-header">
            <h1>Career Assessment Test</h1>
            <p>Answer these questions to evaluate your skills and target career fitment.</p>
        </div>

        <section class="assessment-card" id="quizCard">
            <!-- PROGRESS -->
            <div class="progress-container">
                <div class="progress-info">
                    <span id="questionCount">Question 1 of 3</span>
                    <span id="progressPercent">33% Completed</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <!-- QUESTION CONTAINER -->
            <div id="questionContainer">
                <h2 class="question-title" id="questionText">Loading Question...</h2>
                <div class="options-grid" id="optionsGrid"></div>

                <div class="action-btns">
                    <button class="btn-secondary" id="prevBtn" onclick="prevQuestion()" disabled>Previous</button>
                    <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">Next Question</button>
                </div>
            </div>

            <!-- RESULT CONTAINER (Hidden by Default) -->
            <div class="result-box" id="resultBox">
                <div class="result-icon"><i class="fa-solid fa-circle-check"></i></div>
                <h2>Assessment Completed!</h2>
                <p id="scoreText">Calculating your personality and skills match score...</p>
                <button class="btn-primary" onclick="window.location.href='student-careers.html'">View Recommended
                    Careers</button>
            </div>
        </section>
    </main>

    <!-- SCRIPT (AUTH LOGIC + ASSESSMENT LOGIC) -->
    <script>
        const API_BASE_URL = "http://localhost:8081";

        // ==================== 1. LOGIN & AUTH GUARD LOGIC ====================
        function getToken() {
            return localStorage.getItem("token");
        }

        function getStoredUser() {
            try { return JSON.parse(localStorage.getItem("user") || "null"); }
            catch { return null; }
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "../login.html";
        }

        function verifySession() {
            const token = getToken();
            const user = getStoredUser();

            // Session check logic (as per your initial requirement)
            if (!token || !user) {
                logout();
                return;
            }

            document.getElementById("accountName").textContent = user.name || user.fullName || "Student";
            document.getElementById("accountAvatar").textContent = (user.name || "S").charAt(0).toUpperCase();
        }

        // ==================== 2. ASSESSMENT ENGINE ====================
        const questions = [
            {
                id: 1,
                question: "Which of the following activities do you enjoy the most?",
                options: [
                    { text: "Building software, logic & web applications", category: "Technology" },
                    { text: "Designing graphics, UI/UX, and visual arts", category: "Design" },
                    { text: "Managing budgets, data analysis & financial reports", category: "Finance" },
                    { text: "Teaching, counseling & guiding people", category: "Education" }
                ]
            },
            {
                id: 2,
                question: "How do you prefer to solve complex problems?",
                options: [
                    { text: "By writing code and using algorithmic steps", category: "Technology" },
                    { text: "By brainstorming creative & aesthetic solutions", category: "Design" },
                    { text: "By evaluating mathematical models & data", category: "Finance" },
                    { text: "By talking to people and understanding human behavior", category: "Education" }
                ]
            },
            {
                id: 3,
                question: "What environment do you feel most productive in?",
                options: [
                    { text: "Fast-paced tech startup with modern dev tools", category: "Technology" },
                    { text: "Creative studio focused on art & design", category: "Design" },
                    { text: "Corporate firm dealing with investments & numbers", category: "Finance" },
                    { text: "Academic or community center helping others", category: "Education" }
                ]
            }
        ];

        let currentQuestion = 0;
        let selectedAnswers = {};

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById("questionText").textContent = q.question;
            document.getElementById("questionCount").textContent = `Question ${currentQuestion + 1} of ${questions.length}`;

            const progress = Math.round(((currentQuestion + 1) / questions.length) * 100);
            document.getElementById("progressPercent").textContent = `${progress}% Completed`;
            document.getElementById("progressBar").style.width = `${progress}%`;

            const optionsGrid = document.getElementById("optionsGrid");
            optionsGrid.innerHTML = "";

            q.options.forEach((opt, index) => {
                const isSelected = selectedAnswers[currentQuestion] === index;
                const btn = document.createElement("button");
                btn.className = `option-btn ${isSelected ? 'selected' : ''}`;
                btn.innerHTML = `<span>${opt.text}</span> <i class="fa-regular ${isSelected ? 'fa-circle-check' : 'fa-circle'}"></i>`;
                btn.onclick = () => selectOption(index);
                optionsGrid.appendChild(btn);
            });

            document.getElementById("prevBtn").disabled = currentQuestion === 0;
            document.getElementById("nextBtn").textContent = currentQuestion === questions.length - 1 ? "Submit Assessment" : "Next Question";
        }

        function selectOption(index) {
            selectedAnswers[currentQuestion] = index;
            loadQuestion();
        }

        function nextQuestion() {
            if (selectedAnswers[currentQuestion] === undefined) {
                alert("Please select an option to continue.");
                return;
            }

            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                submitAssessment();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        async function submitAssessment() {
            document.getElementById("questionContainer").style.display = "none";
            document.getElementById("resultBox").style.display = "block";

            // Categorize answers
            const counts = {};
            Object.keys(selectedAnswers).forEach(qIdx => {
                const cat = questions[qIdx].options[selectedAnswers[qIdx]].category;
                counts[cat] = (counts[cat] || 0) + 1;
            });

            const topDomain = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);

            document.getElementById("scoreText").innerHTML = `Assessment evaluation complete! Your top domain preference is <strong>${topDomain}</strong>.`;

            // Optional Backend Sync
            try {
                await fetch(`${API_BASE_URL}/api/student/assessment`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({ preferredCategory: topDomain, answers: selectedAnswers })
                });
            } catch (err) {
                console.warn("Backend sync optional: ", err);
            }
        }

        // Execute Auth Guard on Page Load
        window.addEventListener("DOMContentLoaded", () => {
            verifySession();
            loadQuestion();
        });
    </script>
</body>

</html>
