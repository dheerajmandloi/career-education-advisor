<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CareerAdvisor secure login">
    <title>Login | CareerAdvisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --purple: #8B5CF6;
            --purple-dark: #7C3AED;
            --blue: #3B82F6;
            --cyan: #06B6D4;
            --green: #22C55E;
            --red: #EF4444;
            --bg: #FAFAFE;
            --surface: #FFFFFF;
            --soft: #F5F2FF;
            --text: #172033;
            --text-soft: #525B6D;
            --muted: #7B8190;
            --border: #E7E4F4;
            --gradient: linear-gradient(135deg, #8B5CF6, #3B82F6);
            --shadow: 0 28px 80px rgba(76, 57, 145, .14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            font-family: "Space Grotesk", sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden
        }

        body::-webkit-scrollbar {
            width: 0
        }

        body {
            scrollbar-width: none
        }

        button,
        input {
            font: inherit
        }

        button {
            border: 0
        }

        a {
            text-decoration: none;
            color: inherit
        }

        .page {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 74px 18px 30px;
            overflow: hidden
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(139, 92, 246, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 130, 246, .045) 1px, transparent 1px);
            background-size: 38px 38px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .72), transparent 93%);
            pointer-events: none
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(9px);
            animation: float 9s ease-in-out infinite
        }

        .orb.one {
            width: 450px;
            height: 450px;
            left: -180px;
            top: -175px;
            background: radial-gradient(circle, rgba(139, 92, 246, .23), transparent 69%)
        }

        .orb.two {
            width: 500px;
            height: 500px;
            right: -215px;
            bottom: -230px;
            background: radial-gradient(circle, rgba(59, 130, 246, .19), transparent 70%);
            animation-delay: 1.5s
        }

        .orb.three {
            width: 250px;
            height: 250px;
            left: 53%;
            top: 4%;
            background: radial-gradient(circle, rgba(6, 182, 212, .10), transparent 70%);
            animation-delay: 3s
        }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: rgba(255, 255, 255, .80);
            backdrop-filter: blur(12px);
            color: #596173;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(76, 57, 145, .06);
            transition: .22s
        }

        .back-home:hover {
            color: var(--purple-dark);
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(76, 57, 145, .10)
        }

        .login-card {
            position: relative;
            width: min(500px, 100%);
            padding: 34px 38px 29px;
            border: 1px solid rgba(231, 228, 244, .98);
            border-radius: 28px;
            background: rgba(255, 255, 255, .94);
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            overflow: hidden;
            animation: fadeUp .72s ease both
        }

        .login-card:before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 4px;
            background: var(--gradient)
        }

        .login-card:after {
            content: "";
            position: absolute;
            width: 210px;
            height: 210px;
            right: -105px;
            top: -120px;
            border-radius: 50%;
            background: rgba(139, 92, 246, .10);
            filter: blur(18px);
            pointer-events: none
        }

        .inner-glow {
            position: absolute;
            width: 150px;
            height: 150px;
            left: -95px;
            bottom: -70px;
            border-radius: 50%;
            background: rgba(59, 130, 246, .08);
            filter: blur(20px)
        }

        .brand {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px
        }

        .logo {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 11px 25px rgba(99, 102, 241, .24);
            animation: logoPulse 3.2s ease-in-out infinite
        }

        .logo i {
            font-size: 17px
        }

        .brand span {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -.45px
        }

        .brand span b {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text
        }

        .heading {
            position: relative;
            z-index: 1;
            text-align: center
        }

        .heading h1 {
            font-size: 31px;
            line-height: 1.12;
            letter-spacing: -1px
        }

        .heading p {
            max-width: 385px;
            margin: 8px auto 0;
            color: var(--muted);
            font-size: 11.5px;
            line-height: 1.65
        }

        .security-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 13px;
            padding: 7px 10px;
            border: 1px solid #E6E0FA;
            border-radius: 999px;
            background: #FAF9FF;
            color: var(--purple-dark);
            font-size: 9px;
            font-weight: 700
        }

        .alert {
            position: relative;
            z-index: 1;
            display: none;
            align-items: flex-start;
            gap: 9px;
            margin-top: 17px;
            padding: 11px 12px;
            border-radius: 12px;
            font-size: 10.5px;
            line-height: 1.5
        }

        .alert.show {
            display: flex
        }

        .alert.error {
            color: #B42318;
            background: #FFF7F6;
            border: 1px solid #F2D0CC
        }

        .alert.success {
            color: #16743A;
            background: #F0FBF4;
            border: 1px solid #CFEBD8
        }

        .form {
            position: relative;
            z-index: 1;
            margin-top: 19px
        }

        .field {
            margin-top: 17px
        }

        .field:first-child {
            margin-top: 0
        }

        .label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
            color: #41495A;
            font-size: 11px;
            font-weight: 700
        }

        .input-wrap {
            position: relative
        }

        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #9AA1B0;
            font-size: 13px;
            pointer-events: none;
            transition: .2s
        }

        .input-wrap:focus-within .input-icon {
            color: var(--purple)
        }

        .input {
            width: 100%;
            height: 50px;
            padding: 0 43px 0 39px;
            border: 1px solid var(--border);
            border-radius: 13px;
            outline: none;
            background: #fff;
            color: var(--text);
            font-size: 12px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, .025);
            transition: .22s
        }

        .input::placeholder {
            color: #A6ABB7
        }

        .input:focus {
            border-color: rgba(139, 92, 246, .62);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, .08), 0 9px 23px rgba(99, 102, 241, .07)
        }

        .password-toggle {
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            width: 31px;
            height: 31px;
            border-radius: 9px;
            background: transparent;
            color: #9AA1B0;
            cursor: pointer;
            transition: .2s
        }

        .password-toggle:hover {
            background: var(--soft);
            color: var(--purple)
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 14px 0 19px
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 10px;
            cursor: pointer;
            user-select: none
        }

        .remember input {
            width: 14px;
            height: 14px;
            accent-color: var(--purple);
            cursor: pointer
        }

        .forgot {
            color: var(--purple-dark);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer
        }

        .forgot:hover {
            text-decoration: underline;
            text-underline-offset: 3px
        }

        .login-btn {
            position: relative;
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border-radius: 14px;
            background: var(--gradient);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 13px 28px rgba(99, 102, 241, .23);
            transition: .25s
        }

        .login-btn:before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 22%, rgba(255, 255, 255, .24) 50%, transparent 76%);
            transform: translateX(-120%);
            animation: shine 4.6s ease-in-out infinite
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 17px 33px rgba(99, 102, 241, .29)
        }

        .login-btn:active {
            transform: translateY(0)
        }

        .login-btn:disabled {
            cursor: not-allowed;
            opacity: .68;
            transform: none;
            box-shadow: none
        }

        .login-btn span,
        .login-btn i {
            position: relative;
            z-index: 1
        }

        .spinner {
            display: none;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite
        }

        .login-btn.loading .spinner {
            display: block
        }

        .login-btn.loading .arrow {
            display: none
        }

        .note {
            position: relative;
            z-index: 1;
            margin-top: 20px;
            padding-top: 17px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.6
        }

        .note a {
            color: var(--purple-dark);
            font-weight: 700
        }

        .note a:hover {
            text-decoration: underline;
            text-underline-offset: 3px
        }

        .security {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 12px;
            color: #5D8A70;
            font-size: 9px
        }

        .security i {
            color: var(--green)
        }

        .loader {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(250, 250, 254, .73);
            backdrop-filter: blur(7px)
        }

        .loader.show {
            display: flex
        }

        .loader-card {
            width: min(255px, 90vw);
            padding: 23px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: #fff;
            box-shadow: var(--shadow);
            text-align: center
        }

        .loader-spinner {
            width: 33px;
            height: 33px;
            margin: 0 auto 12px;
            border: 3px solid #ECE9F8;
            border-top-color: var(--purple);
            border-right-color: var(--blue);
            border-radius: 50%;
            animation: spin .8s linear infinite
        }

        .loader-card strong {
            display: block;
            font-size: 13px
        }

        .loader-card span {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 10px
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 60;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: min(345px, calc(100vw - 40px));
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 18px 44px rgba(15, 23, 42, .14);
            transform: translateY(110px);
            opacity: 0;
            pointer-events: none;
            transition: .3s
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1
        }

        .toast-icon {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            flex: none;
            border-radius: 9px;
            background: rgba(34, 197, 94, .09);
            color: var(--green)
        }

        .toast strong {
            display: block;
            font-size: 11px
        }

        .toast p {
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.45
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(22px) scale(.985)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translate3d(0, 0, 0)
            }

            50% {
                transform: translate3d(0, -18px, 0)
            }
        }

        @keyframes logoPulse {

            0%,
            100% {
                box-shadow: 0 11px 25px rgba(99, 102, 241, .24)
            }

            50% {
                box-shadow: 0 13px 31px rgba(99, 102, 241, .35)
            }
        }

        @keyframes shine {

            0%,
            67%,
            100% {
                transform: translateX(-120%)
            }

            79% {
                transform: translateX(120%)
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @media(max-width:560px) {
            .page {
                padding: 69px 12px 18px
            }

            .back-home {
                left: 14px;
                top: 13px
            }

            .login-card {
                width: min(100%, 470px);
                padding: 30px 20px 25px;
                border-radius: 22px
            }

            .brand {
                margin-bottom: 20px
            }

            .heading h1 {
                font-size: 28px
            }

            .heading p {
                font-size: 11px
            }

            .options {
                margin-top: 13px
            }
        }

        @media(max-width:390px) {
            .options {
                align-items: flex-start;
                flex-direction: column
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            :before,
            :after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="grid"></div>
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
        <section class="login-card">
            <div class="inner-glow"></div>
            <div class="brand">
                <div class="logo"><i class="fa-solid fa-compass"></i></div>
                <span>Career<b>Advisor</b></span>
            </div>
            <div class="heading">
                <h1>Welcome back</h1>
                <p>Enter your registered email and password to access your CareerAdvisor account.</p>
                <div class="security-chip"><i class="fa-solid fa-shield-halved"></i> Secure authentication</div>
            </div>
            <div id="messageBox" class="alert" role="alert" aria-live="polite">
                <i id="messageIcon" class="fa-solid fa-circle-info"></i>
                <span id="messageText"></span>
            </div>
            <form id="loginForm" class="form" novalidate>
                <div class="field">
                    <label class="label" for="email">Email Address</label>
                    <div class="input-wrap">
                        <i class="input-icon fa-regular fa-envelope"></i>
                        <input class="input" id="email" name="email" type="email" autocomplete="email" maxlength="120"
                            placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="field">
                    <label class="label" for="password">Password</label>
                    <div class="input-wrap">
                        <i class="input-icon fa-solid fa-lock"></i>
                        <input class="input" id="password" name="password" type="password"
                            autocomplete="current-password" maxlength="120" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password"
                            title="Show password"><i class="fa-regular fa-eye"></i></button>
                    </div>
                </div>
                <div class="options">
                    <label class="remember"><input id="rememberEmail" type="checkbox"><span>Keep me signed
                            in</span></label>
                    <button class="forgot" type="button" id="forgotPassword">Forgot password?</button>
                </div>
                <button id="loginButton" class="login-btn" type="submit">
                    <span class="btn-text">Login</span>
                    <span class="spinner"></span>
                    <i class="arrow fa-solid fa-arrow-right"></i>
                </button>
            </form>
            <div class="note">Don't have an account? <a href="register.html">Create an account</a></div>
            <div class="security"><i class="fa-solid fa-shield-halved"></i> Secure authentication powered by
                CareerAdvisor</div>
        </section>
    </div>
    <div class="loader" id="loader">
        <div class="loader-card">
            <div class="loader-spinner"></div>
            <strong>Signing you in</strong>
            <span>Connecting to CareerAdvisor securely.</span>
        </div>
    </div>
    <div class="toast" id="toast">
        <div class="toast-icon" id="toastIcon"><i class="fa-solid fa-circle-check"></i></div>
        <div><strong id="toastTitle">Success</strong>
            <p id="toastText"></p>
        </div>
    </div>
    <script>
        const API_BASE_URL = "http://localhost:8081";
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const rememberEmail = document.getElementById("rememberEmail");
        const passwordToggle = document.getElementById("passwordToggle");
        const loginButton = document.getElementById("loginButton");
        const messageBox = document.getElementById("messageBox");
        const messageIcon = document.getElementById("messageIcon");
        const messageText = document.getElementById("messageText");
        const loader = document.getElementById("loader");
        const toast = document.getElementById("toast");
        const toastIcon = document.getElementById("toastIcon");
        const toastTitle = document.getElementById("toastTitle");
        const toastText = document.getElementById("toastText");
        const forgotPassword = document.getElementById("forgotPassword");

        function showMessage(type, message) {
            messageBox.className = `alert show ${type}`;
            messageIcon.className = `fa-solid ${type === "error" ? "fa-circle-exclamation" : "fa-circle-check"}`;
            messageText.textContent = message;
        }
        function hideMessage() {
            messageBox.className = "alert";
            messageText.textContent = "";
        }
        function showToast(title, message, type = "success") {
            toastTitle.textContent = title;
            toastText.textContent = message;
            toastIcon.innerHTML = `<i class="fa-solid ${type === "success" ? "fa-circle-check" : "fa-circle-exclamation"}"></i>`;
            toastIcon.style.color = type === "success" ? "var(--green)" : "var(--red)";
            toastIcon.style.background = type === "success" ? "rgba(34,197,94,.09)" : "rgba(239,68,68,.08)";
            toast.classList.add("show");
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => toast.classList.remove("show"), 4000);
        }
        function setLoading(loading) {
            loginButton.disabled = loading;
            loginButton.classList.toggle("loading", loading);
            loginButton.querySelector(".btn-text").textContent = loading ? "Signing in..." : "Login";
            loader.classList.toggle("show", loading);
        }
        function normalizeErrorMessage(responseText, status) {
            const raw = String(responseText || "").trim();
            let message = raw;
            try {
                const parsed = JSON.parse(raw);
                message = parsed?.message || parsed?.error || parsed?.details || raw;
            } catch { }
            const normalized = String(message || "").trim().toLowerCase();
            if (normalized.includes("user not found")) return "User not found";
            if (normalized.includes("invalid credentials") || normalized.includes("invalid password") || normalized.includes("wrong password")) return "Invalid password";
            if (status === 401 || status === 403) return "Invalid password";
            if (status >= 500) return "Server error. Please try again.";
            return message || "Login failed. Please try again.";
        }
        function getDashboard(role) {
            const dashboardPaths = {
                STUDENT: "Student/student-dashboard.html",
                COUNSELOR: "Counselor/counselor-dashboard.html",
                ADMIN: "Admin/admin-dashboard.html"
            };
            return dashboardPaths[String(role || "").toUpperCase()] || null;
        }
        function clearAuth() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
        }
        passwordToggle.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            passwordToggle.innerHTML = `<i class="fa-regular ${isPassword ? "fa-eye-slash" : "fa-eye"}"></i>`;
            passwordToggle.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
            passwordToggle.setAttribute("title", isPassword ? "Hide password" : "Show password");
        });
        forgotPassword.addEventListener("click", () => {
            showMessage("error", "Password recovery is not available yet. Please contact the administrator.");
        });
        const savedEmail = localStorage.getItem("careerAdvisorRememberedEmail");
        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberEmail.checked = true;
        }
        loginForm.addEventListener("submit", async event => {
            event.preventDefault();
            hideMessage();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email) {
                showMessage("error", "Please enter your email address.");
                emailInput.focus();
                return;
            }
            if (!emailInput.checkValidity()) {
                showMessage("error", "Please enter a valid email address.");
                emailInput.focus();
                return;
            }
            if (!password) {
                showMessage("error", "Please enter your password.");
                passwordInput.focus();
                return;
            }
            setLoading(true);
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const text = await response.text();
                if (!response.ok) {
                    const message = normalizeErrorMessage(text, response.status);
                    showMessage("error", message);
                    showToast("Login failed", message, "error");
                    return;
                }
                let result;
                try {
                    result = JSON.parse(text);
                } catch {
                    const message = "Invalid response received from server.";
                    showMessage("error", message);
                    showToast("Login failed", message, "error");
                    return;
                }
                const token = result?.token;
                const user = result?.user;
                if (!token || !user) {
                    const message = "Login succeeded but authentication data is incomplete.";
                    showMessage("error", message);
                    showToast("Login failed", message, "error");
                    return;
                }
                const target = getDashboard(user.role);
                if (!target) {
                    clearAuth();
                    const message = "Invalid user role.";
                    showMessage("error", message);
                    showToast("Login failed", message, "error");
                    return;
                }
                localStorage.setItem("token", token);
                localStorage.setItem("user", JSON.stringify(user));
                if (rememberEmail.checked) {
                    localStorage.setItem("careerAdvisorRememberedEmail", email);
                } else {
                    localStorage.removeItem("careerAdvisorRememberedEmail");
                }
                showMessage("success", "Login successful. Redirecting to your dashboard...");
                showToast("Login successful", "Opening your dashboard.", "success");
                setTimeout(() => window.location.href = target, 650);
            } catch (error) {
                console.error("CareerAdvisor login error:", error);
                const message = "Unable to connect Server";
                showMessage("error", message);
                showToast("Server unavailable", message, "error");
            } finally {
                setLoading(false);
            }
        });
        [emailInput, passwordInput].forEach(input => {
            input.addEventListener("input", () => {
                if (messageBox.classList.contains("show")) hideMessage();
            });
        });
        window.addEventListener("pageshow", () => {
            passwordInput.value = "";
        });
    </script>
</body>

</html>
