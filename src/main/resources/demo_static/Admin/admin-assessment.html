<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assessment Questions - Admin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6fa;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .option-box {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .option-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .option-row {
            display: grid;
            grid-template-columns: 2fr 1fr 100px;
            gap: 10px;
        }

        button {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
            margin-right: 5px;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
        }

        .btn-edit:hover {
            background: #d97706;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        .button-row {
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #f1f5f9;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            background: #e5e7eb;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 800px) {

            .form-row {
                grid-template-columns: 1fr;
            }

            .option-row {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Assessment Questions</h1>
        <p class="subtitle">
            Manage career assessment questions for students.
        </p>


        <!-- ADD / EDIT FORM -->
        <div class="card">

            <h2 id="formTitle">Add Assessment Question</h2>

            <form id="questionForm">

                <input type="hidden" id="questionId">


                <!-- CLASS + STREAM -->
                <div class="form-row">

                    <div class="form-group">
                        <label>Class Group</label>

                        <select id="classGroup" required>
                            <option value="">Select Class</option>
                            <option value="9_10">9th / 10th</option>
                            <option value="11_12">11th / 12th</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Stream</label>

                        <select id="stream" required>
                            <option value="">Select Stream</option>
                            <option value="ALL">All</option>
                            <option value="PCB">PCB</option>
                            <option value="PCM">PCM</option>
                            <option value="Commerce">Commerce</option>
                            <option value="Arts">Arts</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>


                <!-- CATEGORY -->
                <div class="form-group">

                    <label>Question Category</label>

                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="technology">Technology</option>
                        <option value="analytical">Analytical</option>
                        <option value="business">Business</option>
                        <option value="healthcare">Healthcare</option>
                        <option value="social">Social</option>
                        <option value="creative">Creative</option>
                    </select>

                </div>


                <!-- QUESTION -->
                <div class="form-group">

                    <label>Question</label>

                    <textarea id="questionText" placeholder="Enter assessment question..." required>
                </textarea>

                </div>


                <!-- OPTION A -->
                <div class="option-box">

                    <div class="option-title">
                        Option A
                    </div>

                    <div class="option-row">

                        <input type="text" id="optionA" placeholder="Option A text" required>

                        <select id="optionACategory" required>
                            <option value="">Category</option>
                            <option value="technology">Technology</option>
                            <option value="analytical">Analytical</option>
                            <option value="business">Business</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="social">Social</option>
                            <option value="creative">Creative</option>
                        </select>

                        <input type="number" id="optionAScore" placeholder="Score" value="1" min="0" required>

                    </div>

                </div>


                <!-- OPTION B -->
                <div class="option-box">

                    <div class="option-title">
                        Option B
                    </div>

                    <div class="option-row">

                        <input type="text" id="optionB" placeholder="Option B text" required>

                        <select id="optionBCategory" required>
                            <option value="">Category</option>
                            <option value="technology">Technology</option>
                            <option value="analytical">Analytical</option>
                            <option value="business">Business</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="social">Social</option>
                            <option value="creative">Creative</option>
                        </select>

                        <input type="number" id="optionBScore" placeholder="Score" value="1" min="0" required>

                    </div>

                </div>


                <!-- OPTION C -->
                <div class="option-box">

                    <div class="option-title">
                        Option C
                    </div>

                    <div class="option-row">

                        <input type="text" id="optionC" placeholder="Option C text" required>

                        <select id="optionCCategory" required>
                            <option value="">Category</option>
                            <option value="technology">Technology</option>
                            <option value="analytical">Analytical</option>
                            <option value="business">Business</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="social">Social</option>
                            <option value="creative">Creative</option>
                        </select>

                        <input type="number" id="optionCScore" placeholder="Score" value="1" min="0" required>

                    </div>

                </div>


                <!-- OPTION D -->
                <div class="option-box">

                    <div class="option-title">
                        Option D
                    </div>

                    <div class="option-row">

                        <input type="text" id="optionD" placeholder="Option D text" required>

                        <select id="optionDCategory" required>
                            <option value="">Category</option>
                            <option value="technology">Technology</option>
                            <option value="analytical">Analytical</option>
                            <option value="business">Business</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="social">Social</option>
                            <option value="creative">Creative</option>
                        </select>

                        <input type="number" id="optionDScore" placeholder="Score" value="1" min="0" required>

                    </div>

                </div>


                <!-- ACTIVE -->
                <div class="form-group">

                    <label>
                        <input type="checkbox" id="active" checked style="width:auto;">

                        Active
                    </label>

                </div>


                <!-- BUTTONS -->
                <div class="button-row">

                    <button type="submit" class="btn-primary" id="saveButton">
                        Add Question
                    </button>

                    <button type="button" class="btn-secondary hidden" id="cancelButton" onclick="resetForm()">
                        Cancel Edit
                    </button>

                </div>

            </form>


            <div id="message" class="message">
            </div>

        </div>



        <!-- QUESTIONS LIST -->
        <div class="card">

            <h2>All Assessment Questions</h2>

            <button class="btn-primary" onclick="loadQuestions()">
                Refresh Questions
            </button>


            <div style="overflow-x:auto;">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Question</th>

                            <th>Class</th>

                            <th>Stream</th>

                            <th>Category</th>

                            <th>Status</th>

                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="questionsTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        const API_BASE =
            "http://localhost:8081/api/assessment/questions";


        document
            .getElementById("questionForm")
            .addEventListener("submit", saveQuestion);


        // =========================
        // LOAD QUESTIONS
        // =========================

        async function loadQuestions() {

            try {

                const response =
                    await fetch(`${API_BASE}/admin/all`);

                if (!response.ok) {

                    throw new Error(
                        "Failed to load questions"
                    );

                }

                const questions =
                    await response.json();

                displayQuestions(questions);

            } catch (error) {

                console.error(error);

                showMessage(
                    "Failed to load questions.",
                    "error"
                );
            }
        }


        // =========================
        // DISPLAY QUESTIONS
        // =========================

        function displayQuestions(questions) {

            const table =
                document.getElementById(
                    "questionsTable"
                );

            table.innerHTML = "";


            if (questions.length === 0) {

                table.innerHTML = `
                <tr>
                    <td colspan="7">
                        No assessment questions found.
                    </td>
                </tr>
            `;

                return;
            }


            questions.forEach(question => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                <td>
                    ${question.id}
                </td>

                <td>
                    ${escapeHtml(
                    question.questionText
                )}
                </td>

                <td>
                    ${question.classGroup || "-"}
                </td>

                <td>
                    ${question.stream || "-"}
                </td>

                <td>
                    ${question.category || "-"}
                </td>

                <td>

                    ${question.active

                        ?

                        `<span class="badge active">
                            Active
                        </span>`

                        :

                        `<span class="badge inactive">
                            Inactive
                        </span>`
                    }

                </td>

                <td>

                    <button
                        class="btn-edit"
                        onclick="editQuestion(${question.id})">
                        Edit
                    </button>

                    ${question.active

                        ?

                        `<button
                            class="btn-delete"
                            onclick="deleteQuestion(${question.id})">
                            Deactivate
                        </button>`

                        :

                        ""
                    }

                </td>

            `;


                table.appendChild(row);

            });

        }


        // =========================
        // ADD / UPDATE QUESTION
        // =========================

        async function saveQuestion(event) {

            event.preventDefault();


            const id =
                document.getElementById(
                    "questionId"
                ).value;


            const question = {

                questionText:
                    document.getElementById(
                        "questionText"
                    ).value.trim(),

                optionA:
                    document.getElementById(
                        "optionA"
                    ).value.trim(),

                optionB:
                    document.getElementById(
                        "optionB"
                    ).value.trim(),

                optionC:
                    document.getElementById(
                        "optionC"
                    ).value.trim(),

                optionD:
                    document.getElementById(
                        "optionD"
                    ).value.trim(),


                optionACategory:
                    document.getElementById(
                        "optionACategory"
                    ).value,

                optionBCategory:
                    document.getElementById(
                        "optionBCategory"
                    ).value,

                optionCCategory:
                    document.getElementById(
                        "optionCCategory"
                    ).value,

                optionDCategory:
                    document.getElementById(
                        "optionDCategory"
                    ).value,


                optionAScore:
                    Number(
                        document.getElementById(
                            "optionAScore"
                        ).value
                    ),

                optionBScore:
                    Number(
                        document.getElementById(
                            "optionBScore"
                        ).value
                    ),

                optionCScore:
                    Number(
                        document.getElementById(
                            "optionCScore"
                        ).value
                    ),

                optionDScore:
                    Number(
                        document.getElementById(
                            "optionDScore"
                        ).value
                    ),


                classGroup:
                    document.getElementById(
                        "classGroup"
                    ).value,

                stream:
                    document.getElementById(
                        "stream"
                    ).value,

                category:
                    document.getElementById(
                        "category"
                    ).value,

                active:
                    document.getElementById(
                        "active"
                    ).checked

            };


            try {

                let response;


                if (id) {

                    // UPDATE

                    response = await fetch(
                        `${API_BASE}/admin/${id}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    question
                                )
                        }
                    );

                } else {

                    // ADD

                    response = await fetch(
                        `${API_BASE}/admin`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    question
                                )
                        }
                    );

                }


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText ||
                        "Request failed"
                    );

                }


                showMessage(
                    id
                        ? "Question updated successfully."
                        : "Question added successfully.",
                    "success"
                );


                resetForm();

                loadQuestions();


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message ||
                    "Failed to save question.",
                    "error"
                );

            }

        }


        // =========================
        // EDIT QUESTION
        // =========================

        async function editQuestion(id) {

            try {

                const response =
                    await fetch(
                        `${API_BASE}/admin/${id}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Question not found"
                    );

                }


                const question =
                    await response.json();


                document.getElementById(
                    "questionId"
                ).value =
                    question.id;


                document.getElementById(
                    "questionText"
                ).value =
                    question.questionText || "";


                document.getElementById(
                    "optionA"
                ).value =
                    question.optionA || "";

                document.getElementById(
                    "optionB"
                ).value =
                    question.optionB || "";

                document.getElementById(
                    "optionC"
                ).value =
                    question.optionC || "";

                document.getElementById(
                    "optionD"
                ).value =
                    question.optionD || "";


                document.getElementById(
                    "optionACategory"
                ).value =
                    question.optionACategory || "";

                document.getElementById(
                    "optionBCategory"
                ).value =
                    question.optionBCategory || "";

                document.getElementById(
                    "optionCCategory"
                ).value =
                    question.optionCCategory || "";

                document.getElementById(
                    "optionDCategory"
                ).value =
                    question.optionDCategory || "";


                document.getElementById(
                    "optionAScore"
                ).value =
                    question.optionAScore ?? 1;

                document.getElementById(
                    "optionBScore"
                ).value =
                    question.optionBScore ?? 1;

                document.getElementById(
                    "optionCScore"
                ).value =
                    question.optionCScore ?? 1;

                document.getElementById(
                    "optionDScore"
                ).value =
                    question.optionDScore ?? 1;


                document.getElementById(
                    "classGroup"
                ).value =
                    question.classGroup || "";

                document.getElementById(
                    "stream"
                ).value =
                    question.stream || "";

                document.getElementById(
                    "category"
                ).value =
                    question.category || "";

                document.getElementById(
                    "active"
                ).checked =
                    question.active;


                document.getElementById(
                    "formTitle"
                ).innerText =
                    "Edit Assessment Question";


                document.getElementById(
                    "saveButton"
                ).innerText =
                    "Update Question";


                document.getElementById(
                    "cancelButton"
                ).classList.remove(
                    "hidden"
                );


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });


            } catch (error) {

                console.error(error);

                showMessage(
                    "Failed to load question.",
                    "error"
                );

            }

        }


        // =========================
        // DELETE / DEACTIVATE
        // =========================

        async function deleteQuestion(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to deactivate this question?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_BASE}/admin/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to deactivate question"
                    );

                }


                showMessage(
                    "Question deactivated successfully.",
                    "success"
                );


                loadQuestions();


            } catch (error) {

                console.error(error);

                showMessage(
                    "Failed to deactivate question.",
                    "error"
                );

            }

        }


        // =========================
        // RESET FORM
        // =========================

        function resetForm() {

            document
                .getElementById("questionForm")
                .reset();


            document.getElementById(
                "questionId"
            ).value = "";


            document.getElementById(
                "active"
            ).checked = true;


            document.getElementById(
                "optionAScore"
            ).value = 1;

            document.getElementById(
                "optionBScore"
            ).value = 1;

            document.getElementById(
                "optionCScore"
            ).value = 1;

            document.getElementById(
                "optionDScore"
            ).value = 1;


            document.getElementById(
                "formTitle"
            ).innerText =
                "Add Assessment Question";


            document.getElementById(
                "saveButton"
            ).innerText =
                "Add Question";


            document.getElementById(
                "cancelButton"
            ).classList.add(
                "hidden"
            );

        }


        // =========================
        // MESSAGE
        // =========================

        function showMessage(
            message,
            type
        ) {

            const element =
                document.getElementById(
                    "message"
                );


            element.innerText =
                message;


            element.className =
                `message ${type}`;


            element.style.display =
                "block";


            setTimeout(() => {

                element.style.display =
                    "none";

            }, 4000);

        }


        // =========================
        // HTML ESCAPE
        // =========================

        function escapeHtml(value) {

            if (!value) {
                return "";
            }

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // LOAD WHEN PAGE OPENS

        loadQuestions();

    </script>

</body>

</html>
