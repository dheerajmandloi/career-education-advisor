<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Counselors List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 1200px;
            max-width: 95%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h2 {
            margin: 0;
            color: #333;
        }

        .back-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .back-btn:hover {
            background-color: #222;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f1f1f1;
        }

        tr:hover {
            background-color: #fafafa;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .pending-profile {
            background-color: #fff3cd;
            color: #856404;
        }

        .pending-review {
            background-color: #cfe2ff;
            color: #084298;
        }

        .approved {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .rejected {
            background-color: #f8d7da;
            color: #842029;
        }

        .view-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .view-btn:hover {
            background-color: #0069d9;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>

</head>


<body>

    <div class="container">

        <!-- ================= TOP BAR ================= -->

        <div class="top-bar">

            <h2>
                Counselors List
            </h2>

            <button class="back-btn" onclick="goBack()">

                ← Back to Dashboard

            </button>

        </div>


        <p class="subtitle">

            View and manage all registered counselors.

        </p>


        <!-- ================= TABLE ================= -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Qualification
                        </th>

                        <th>
                            Experience
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="counselorTableBody">

                    <tr>

                        <td colspan="8" class="empty">

                            Loading counselors...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <p id="message"></p>

    </div>


    <script>

        // ================= TOKEN =================

        const token =
            localStorage.getItem("token");


        // ================= SESSION CHECK =================

        if (!token) {

            alert(
                "Session expired. Please login again."
            );

            window.location.href =
                "../Login.html";
        }


        // ================= LOAD COUNSELORS =================

        async function loadCounselors() {

            try {

                /*
                 * This endpoint will return
                 * all counselors.
                 */

                const response = await fetch(
                    "http://localhost:8081/api/admin/counselors",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        typeof result === "string"
                            ? result
                            : "Failed to load counselors."
                    );
                }


                const tableBody =
                    document.getElementById(
                        "counselorTableBody"
                    );


                tableBody.innerHTML = "";


                // No counselors

                if (!result || result.length === 0) {

                    tableBody.innerHTML = `
                        <tr>
                            <td
                                colspan="8"
                                class="empty">

                                No counselors found.

                            </td>
                        </tr>
                    `;

                    return;
                }


                // ================= CREATE ROWS =================

                result.forEach(function (counselor) {

                    const row =
                        document.createElement("tr");


                    let statusClass =
                        "pending-profile";


                    if (
                        counselor.status ===
                        "PENDING_REVIEW"
                    ) {

                        statusClass =
                            "pending-review";

                    } else if (
                        counselor.status ===
                        "APPROVED"
                    ) {

                        statusClass =
                            "approved";

                    } else if (
                        counselor.status ===
                        "REJECTED"
                    ) {

                        statusClass =
                            "rejected";
                    }


                    row.innerHTML = `

                        <td>
                            ${counselor.id}
                        </td>

                        <td>
                            ${counselor.name || "-"}
                        </td>

                        <td>
                            ${counselor.email || "-"}
                        </td>

                        <td>
                            ${counselor.phone || "-"}
                        </td>

                        <td>
                            ${counselor.highestQualification || "-"}
                        </td>

                        <td>
                            ${counselor.experienceYears != null
                            ? counselor.experienceYears + " years"
                            : "-"
                        }
                        </td>

                        <td>

                            <span
                                class="status ${statusClass}">

                                ${counselor.status || "-"}

                            </span>

                        </td>

                        <td>

                            <button
                                class="view-btn"
                                onclick="viewCounselor(${counselor.id})">

                                View

                            </button>

                        </td>

                    `;


                    tableBody.appendChild(row);

                });


            } catch (error) {

                document.getElementById(
                    "counselorTableBody"
                ).innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            class="empty">

                            ${error.message}

                        </td>

                    </tr>

                `;
            }

        }


        // ================= VIEW COUNSELOR =================

        function viewCounselor(counselorId) {

            window.location.href =
                "AdminCounselorProfile.html?id="
                + counselorId;

        }


        // ================= BACK =================

        function goBack() {

            window.location.href =
                "AdminDashboard.html";

        }


        // ================= LOAD =================

        loadCounselors();

    </script>

</body>

</html>
