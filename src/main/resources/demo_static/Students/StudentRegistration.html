<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #0069d9;
        }

        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        #otpSection {
            display: none;
        }

        #verifyButton {
            background-color: #28a745;
        }

        #verifyButton:hover {
            background-color: #218838;
        }

        #registerButton {
            display: none;
        }

        #verifiedMessage {
            display: none;
            color: green;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Student Registration</h2>

        <form id="registerForm">

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <!-- SEND OTP -->
            <button type="button" id="sendOtpButton">
                Send OTP
            </button>

            <!-- OTP SECTION -->
            <div id="otpSection">

                <label for="otp">Enter OTP</label>

                <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6">

                <button type="button" id="verifyButton">
                    Verify OTP
                </button>

                <p id="verifiedMessage">
                    ✓ Email Verified
                </p>

            </div>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <!-- REGISTER -->
            <button type="submit" id="registerButton">
                Register
            </button>

        </form>

        <p id="message"></p>

        <div class="login-link">
            Already have an account?
            <a href="../Login.html">Login</a>
        </div>

    </div>


    <script>

        let emailVerified = false;


        // ================= SEND OTP =================

        document
            .getElementById("sendOtpButton")
            .addEventListener("click", async function () {

                const email =
                    document.getElementById("email").value.trim();

                const message =
                    document.getElementById("message");

                if (!email) {

                    alert("Please enter your email first.");
                    return;
                }

                try {

                    this.disabled = true;
                    this.innerText = "Sending OTP...";

                    const response = await fetch(
                        "http://localhost:8081/api/auth/send-otp",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email
                            })
                        }
                    );

                    const result =
                        await response.text();

                    if (response.ok) {

                        alert(
                            "OTP sent successfully!\n\n" +
                            "Please check your email."
                        );

                        document
                            .getElementById("otpSection")
                            .style.display = "block";

                        message.innerText =
                            "OTP sent to your email.";

                        message.style.color = "green";

                    } else {

                        alert(
                            "Failed to send OTP!\n\n" +
                            result
                        );

                        this.disabled = false;
                        this.innerText = "Send OTP";
                    }

                } catch (error) {

                    alert(
                        "Something went wrong!\n\n" +
                        error.message
                    );

                    this.disabled = false;
                    this.innerText = "Send OTP";
                }

            });


        // ================= VERIFY OTP =================

        document
            .getElementById("verifyButton")
            .addEventListener("click", async function () {

                const email =
                    document.getElementById("email").value.trim();

                const otp =
                    document.getElementById("otp").value.trim();

                const message =
                    document.getElementById("message");

                if (!otp) {

                    alert("Please enter the OTP.");
                    return;
                }

                if (otp.length !== 6) {

                    alert("OTP must be 6 digits.");
                    return;
                }

                try {

                    this.disabled = true;
                    this.innerText = "Verifying...";

                    const response = await fetch(
                        "http://localhost:8081/api/auth/verify-otp",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                otp: otp
                            })
                        }
                    );

                    const result =
                        await response.text();

                    if (response.ok) {

                        emailVerified = true;

                        alert(
                            "Email verified successfully!"
                        );

                        document
                            .getElementById("verifiedMessage")
                            .style.display = "block";

                        document
                            .getElementById("otp")
                            .disabled = true;

                        this.style.display = "none";

                        document
                            .getElementById("sendOtpButton")
                            .style.display = "none";

                        document
                            .getElementById("registerButton")
                            .style.display = "block";

                        document
                            .getElementById("email")
                            .readOnly = true;

                        message.innerText =
                            "Email verification successful.";

                        message.style.color = "green";

                    } else {

                        alert(
                            "OTP Verification Failed!\n\n" +
                            result
                        );

                        this.disabled = false;
                        this.innerText = "Verify OTP";
                    }

                } catch (error) {

                    alert(
                        "Something went wrong!\n\n" +
                        error.message
                    );

                    this.disabled = false;
                    this.innerText = "Verify OTP";
                }

            });


        // ================= REGISTER =================

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                // Extra frontend protection
                if (!emailVerified) {

                    alert(
                        "Please verify your email with OTP first."
                    );

                    return;
                }

                const name =
                    document.getElementById("name").value;

                const email =
                    document.getElementById("email").value;

                const phone =
                    document.getElementById("phone").value;

                const password =
                    document.getElementById("password").value;

                const data = {

                    name: name,
                    email: email,
                    phone: phone,
                    password: password

                };

                try {

                    const response = await fetch(
                        "http://localhost:8081/api/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(data)
                        }
                    );

                    const result =
                        await response.text();

                    if (response.ok) {

                        alert(
                            "Registration Successful!"
                        );

                        document
                            .getElementById("registerForm")
                            .reset();

                        window.location.href =
                            "StudentsLogin.html";

                    } else {

                        alert(
                            "Registration Failed!\n\n" +
                            (result || "Unknown error")
                        );
                    }

                } catch (error) {

                    alert(
                        "Something went wrong!\n\n" +
                        error.message
                    );

                }

            });

    </script>

</body>

</html>
