<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 70px auto;
            background-color: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #0069d9;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Login</h2>

        <form id="loginForm">

            <label for="email">Email</label>

            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>

            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="Register.html">
                Register
            </a>

        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;


                const data = {
                    email: email,
                    password: password
                };


                try {

                    const response = await fetch(
                        "http://localhost:8081/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(data)
                        }
                    );


                    const result = await response.json();


                    if (response.ok) {

                        // ================= SAVE JWT =================

                        localStorage.setItem(
                            "token",
                            result.token
                        );


                        // ================= SAVE USER =================

                        localStorage.setItem(
                            "user",
                            JSON.stringify(result.user)
                        );


                        // ================= SAVE USER ID =================

                        localStorage.setItem(
                            "userId",
                            result.user.id
                        );


                        alert("Login Successful!");


                        // ================= GET ROLE =================

                        const role = String(
                            result.user?.role || ""
                        ).toUpperCase();


                        // ================= GET STATUS =================

                        const status = String(
                            result.user?.status || ""
                        ).toUpperCase();


                        // ================= ADMIN =================

                        if (role === "ADMIN") {

                            window.location.href =
                                "Admin/AdminDashboard.html";
                        }


                        // ================= STUDENT =================

                        else if (role === "STUDENT") {

                            window.location.href =
                                "Students/StudentHome.html";
                        }


                        // ================= COUNSELOR =================

                        else if (role === "COUNSELOR") {

                            if (status === "PENDING_PROFILE") {

                                window.location.href =
                                    "Counselor/CounselorProfile.html";

                            } else if (status === "PENDING_REVIEW") {

                                alert(
                                    "Your profile has been submitted and is waiting for admin approval."
                                );

                            } else if (status === "APPROVED") {

                                window.location.href =
                                    "Counselor/CounselorDashboard.html";

                            } else if (status === "REJECTED") {

                                alert(
                                    "Your counselor profile was rejected. Please update and resubmit your profile."
                                );

                                window.location.href =
                                    "Counselor/CounselorProfile.html";

                            } else {

                                alert(
                                    "Unknown counselor account status."
                                );
                            }
                        }


                        // ================= INVALID ROLE =================

                        else {

                            alert("Invalid user role.");
                        }


                    } else {

                        alert(
                            "Login Failed!\n\n" +
                            (
                                typeof result === "string"
                                    ? result
                                    : JSON.stringify(result)
                            )
                        );
                    }


                } catch (error) {

                    alert(
                        "Something went wrong!\n\n" +
                        error.message
                    );
                }

            });

    </script>

</body>

</html>
