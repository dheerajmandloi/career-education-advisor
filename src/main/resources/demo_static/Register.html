<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career & Education Advisor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 80px auto;
            background-color: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        .login-btn {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 25px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .register-title {
            margin-top: 20px;
        }

        .role-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .role-card {
            width: 120px;
            padding: 20px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-decoration: none;
            color: #222;
            background-color: #fafafa;
        }

        .role-card:hover {
            background-color: #eeeeee;
        }

        .role-card h3 {
            margin: 0 0 8px 0;
        }

        .role-card p {
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Career & Education Advisor</h1>

        <p>Welcome to Career & Education Advisor</p>

        <p>Choose an option to continue.</p>


        <!-- Login -->

        <a href="login.html" class="login-btn">
            Login
        </a>


        <!-- Registration -->

        <h3 class="register-title">Register as</h3>

        <div class="role-container">

            <a href="Students/StudentRegistration.html" class="role-card">

                <h3>Student</h3>

                <p>Student Registration</p>

            </a>


            <a href="counselor-registration.html" class="role-card">

                <h3>Counselor</h3>

                <p>Counselor Registration</p>

            </a>


            <a href="admin-registration.html" class="role-card">

                <h3>Admin</h3>

                <p>Admin Registration</p>

            </a>

        </div>

    </div>

</body>

</html>
