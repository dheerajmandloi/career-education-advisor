<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career & Education Advisor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 100px auto;
            background-color: white;
            padding: 35px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        .register-title {
            margin-top: 30px;
        }

        .role-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .role-card {
            width: 150px;
            padding: 25px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-decoration: none;
            color: #222;
            background-color: #fafafa;
            transition: 0.2s;
        }

        .role-card:hover {
            background-color: #eeeeee;
            border-color: #999;
            transform: translateY(-2px);
        }

        .role-card h3 {
            margin: 0 0 8px 0;
        }

        .role-card p {
            margin: 0;
            font-size: 13px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Career & Education Advisor</h1>

        <p>Choose your role to continue registration.</p>

        <h3 class="register-title">Register As</h3>

        <div class="role-container">

            <!-- Student Registration -->

            <a href="Students/StudentRegistration.html" class="role-card">

                <h3>Student</h3>

                <p>Register as Student</p>

            </a>


            <!-- Counselor Registration -->

            <a href="Counselor/CounselorRegistration.html" class="role-card">

                <h3>Counselor</h3>

                <p>Register as Counselor</p>

            </a>

        </div>

    </div>

</body>

</html>
